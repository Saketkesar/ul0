<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Pine Forest -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16483C"/>
      <stop offset="45%" stop-color="#0E2F27"/>
      <stop offset="100%" stop-color="#061814"/>
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EF5CE" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#3DDBB8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#14463B" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Ambient Upper Glow -->
    <radialGradient id="ambient" cx="38%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#3DDBB8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#16483C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#061814" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Capsule Gradient (Fresh Ice Mint) -->
    <linearGradient id="capsuleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFCF7"/>
      <stop offset="100%" stop-color="#A2EED9"/>
    </linearGradient>

    <!-- Right Capsule Gradient (Vibrant Electric Mint) -->
    <linearGradient id="capsuleRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55F8D1"/>
      <stop offset="100%" stop-color="#24C9A2"/>
    </linearGradient>

    <!-- Drop Shadow for 3D Tactile Pop -->
    <filter id="linkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#020907" flood-opacity="0.65"/>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Tactile Border -->
  <rect x="3" y="3" width="122" height="122" rx="32" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="32" fill="url(#ambient)"/>
  <rect x="3.5" y="3.5" width="121" height="121" rx="31.5" fill="none" stroke="url(#borderGlow)" stroke-width="2.5"/>

  <!-- Top-Right Catchy Sparkle Dot (Draws Eye) -->
  <g transform="translate(100, 26)" filter="url(#sparkleGlow)">
    <circle cx="0" cy="0" r="4.5" fill="#3DDBB8" opacity="0.95"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    <path d="M0 -6.5 L0 6.5 M-6.5 0 L6.5 0" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Bottom-Left Micro Accent Dot -->
  <circle cx="25" cy="103" r="2.5" fill="#3DDBB8" opacity="0.65"/>
  <circle cx="25" cy="103" r="1.2" fill="#FFFFFF" opacity="0.9"/>

  <!-- Iconic UL0 Interlocking Link with Shadow -->
  <g filter="url(#linkShadow)">
    <g transform="translate(64, 64) scale(0.56) translate(-100, -100)">
      <g transform="rotate(-38 100 100)">
        <!-- Left Capsule (Frost Mint) -->
        <rect x="24" y="74" width="96" height="52" rx="26" fill="url(#capsuleLeft)" stroke="#061814" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Right Capsule (Electric Mint) -->
        <rect x="80" y="74" width="96" height="52" rx="26" fill="url(#capsuleRight)" stroke="#061814" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Left Cutout (Crisp White Eye) -->
        <rect x="40" y="87" width="38" height="26" rx="13" fill="#FFFFFF" stroke="#061814" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Right Cutout (Crisp White Eye) -->
        <rect x="122" y="87" width="38" height="26" rx="13" fill="#FFFFFF" stroke="#061814" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>