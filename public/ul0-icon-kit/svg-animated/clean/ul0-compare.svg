<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>.m{transform-origin:100px 100px;transform-box:view-box;animation:wiggle 2s ease-in-out infinite}.s{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}.s1{animation-delay:-.66s}.s2{animation-delay:-1.33s}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes tw{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.m,.s{animation:none}}</style><g class="m"><g transform="translate(100 100) scale(1.0) translate(-100 -100)"><path d="M100 50V146M40 72H160" fill="none" stroke="#0B1A17" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 72L22 112M44 72L66 112M156 72L134 112M156 72L178 112" fill="none" stroke="#0B1A17" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 112H66A22 22 0 0 1 22 112Z" fill="#B4F0E0" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M134 112H178A22 22 0 0 1 134 112Z" fill="#3DDBB8" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="64" y="146" width="72" height="16" rx="8" fill="#3DDBB8" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100" cy="46" r="9" fill="#3DDBB8" stroke="#0B1A17" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g></g></svg>