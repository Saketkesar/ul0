<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>.m{transform-origin:100px 100px;transform-box:view-box;animation:bob 2s ease-in-out infinite}.s{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}.s1{animation-delay:-.66s}.s2{animation-delay:-1.33s}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes tw{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.m,.s{animation:none}}</style><g class="m"><g transform="translate(100 100) scale(1.0) translate(-100 -100)"><path d="M56 36H144Q170 36 170 62V112Q170 138 144 138H98L58 168V138H56Q30 138 30 112V62Q30 36 56 36Z" fill="#3DDBB8" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M111.1738019169329 103.585303514377H88.86325878594249L85.34249201277954 113.66581469648563H71.0L91.49456869009585 58.33418530351438H108.50543130990414L129.0 113.66581469648563H114.65750798722044ZM92.42108626198083 93.31948881789138H107.57891373801917L100.0185303514377 71.30543130990415Z" fill="#0B1A17"/></g></g></svg>