<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>.m{transform-origin:100px 100px;transform-box:view-box;animation:wiggle 2s ease-in-out infinite}.s{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}.s1{animation-delay:-.66s}.s2{animation-delay:-1.33s}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes tw{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.m,.s{animation:none}}</style><g class="m"><g transform="translate(100 100) scale(1.0) translate(-100 -100)"><path d="M 100.0 32.0 L 120.0 76.5 L 168.5 81.8 L 132.3 114.5 L 142.3 162.2 L 100.0 138.0 L 57.7 162.2 L 67.7 114.5 L 31.5 81.8 L 80.0 76.5 Z" fill="#3DDBB8" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100" cy="106" r="27" fill="#FFFFFF" stroke="#0B1A17" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="100" cy="106" rx="9" ry="13" fill="none" stroke="#0B1A17" stroke-width="7"/></g></g></svg>