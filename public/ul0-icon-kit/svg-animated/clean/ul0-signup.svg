<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>.m{transform-origin:100px 100px;transform-box:view-box;animation:bob 2s ease-in-out infinite}.s{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}.s1{animation-delay:-.66s}.s2{animation-delay:-1.33s}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes tw{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.m,.s{animation:none}}</style><g class="m"><g transform="translate(100 100) scale(1.0) translate(-100 -100)"><path d="M28 166Q28 116 84 116Q140 116 140 166Z" fill="#B4F0E0" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="84" cy="72" r="28" fill="#3DDBB8" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="146" cy="138" r="26" fill="#F2B544" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M146 126V150M134 138H158" fill="none" stroke="#0B1A17" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>