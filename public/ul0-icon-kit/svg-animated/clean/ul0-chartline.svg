<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>.m{transform-origin:100px 100px;transform-box:view-box;animation:bob 2s ease-in-out infinite}.s{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}.s1{animation-delay:-.66s}.s2{animation-delay:-1.33s}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes tw{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.m,.s{animation:none}}</style><g class="m"><g transform="translate(100 100) scale(1.0) translate(-100 -100)"><path d="M40 38V162H166" fill="none" stroke="#0B1A17" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 132L88 96L112 116L156 58" fill="none" stroke="#0B1A17" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 132L88 96L112 116L156 58" fill="none" stroke="#3DDBB8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="96" r="8" fill="#FFFFFF" stroke="#0B1A17" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="156" cy="58" r="8" fill="#FFFFFF" stroke="#0B1A17" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g></g></svg>