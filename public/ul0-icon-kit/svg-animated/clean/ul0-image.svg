<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>.m{transform-origin:100px 100px;transform-box:view-box;animation:bob 2s ease-in-out infinite}.s{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}.s1{animation-delay:-.66s}.s2{animation-delay:-1.33s}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07)}}@keyframes tw{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.m,.s{animation:none}}</style><g class="m"><g transform="translate(100 100) scale(1.0) translate(-100 -100)"><rect x="30" y="44" width="140" height="112" rx="18" fill="#FFFFFF" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 132L70 86L100 120L124 98L170 142V140Q170 156 152 156H48Q30 156 30 138Z" fill="#3DDBB8" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="128" cy="72" r="12" fill="#F2B544" stroke="#0B1A17" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g></g></svg>